[project]
name = "sequentialist-agentic"
version = "0.1.0"
description = "Statistically guaranteed decision-making for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # В будущем здесь будет реальная ссылка на пакет sequential-search
    # "sequential-search @ git+https://github.com/andre-a-no/sequential-search.git",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
