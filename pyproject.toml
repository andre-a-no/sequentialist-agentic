[project]
name = "sequential-search"
version = "0.1.0"
description = "Statistically guaranteed decision-making for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Реальное математическое ядро (PyPI name: sequential-search-core).
    # Якорь на конкретный коммит (тегов в upstream пока нет) — воспроизводимо.
    "sequential-search-core @ git+https://github.com/andre-a-no/sequential-search.git@45fbe4cdba647b59ec3fd528cad94019cece3ba9",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
